<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>City Generator</title>
  <link rel="icon" href="./favicon.png">
  <link rel="stylesheet" href="./controls.css?build=__CITY_BUILD_ID__">
</head>
<body>
  <header class="toolbar">
    <div class="identity">
      <h1>City Generator</h1>
      <span class="build">Build <output id="build-id"></output></span>
    </div>
    <div class="settings">
      <form id="seed-form" class="seed-setting">
        <label for="seed">Seed <input id="seed" type="number" min="1" max="2147483646" step="1" required disabled></label>
        <button id="apply-seed" type="submit" title="Apply seed" aria-label="Apply seed" disabled><img src="./icons/check.svg" alt=""><span>Apply</span></button>
      </form>
      <label for="city-size">City size <input id="city-size" type="number" min="6" max="40" step="1" value="40" disabled></label>
      <label class="wall-setting"><input id="walls" type="checkbox" disabled> Walls</label>
      <label class="building-setting" for="buildings">Buildings <select id="buildings" aria-label="Buildings" disabled><option value="original">Original</option><option value="footprints">Footprints</option><option value="frontage">Block Rows</option></select></label>
      <label for="render-style">Style <select id="render-style" aria-label="Rendering style" disabled><option value="flat">Flat</option><option value="roofed">Roofed</option><option value="diagnostic">Diagnostic</option></select></label>
      <label for="neighborhood-layout">Layout <select id="neighborhood-layout" aria-label="Neighborhood layout" disabled><option value="standard">Standard</option><option value="prototype">One District</option><option value="frontage-growth">Frontage Growth</option><option value="mixed">Mixed</option></select></label>
    </div>
    <div class="actions">
      <button id="site-contract" type="button" title="Inspect site contract" aria-label="Inspect site contract"><img src="./icons/map.svg" alt=""><span>Site Contract</span></button>
      <button id="regenerate" type="button" title="Generate a new city" aria-label="Generate a new city" disabled><img src="./icons/refresh-cw.svg" alt=""><span>New City</span></button>
      <button id="copy-link" type="button" title="Copy city link" aria-label="Copy city link" disabled><img src="./icons/link.svg" alt=""><span>Copy Link</span></button>
      <button id="compare" type="button" title="Compare builds" aria-label="Compare builds" disabled><img src="./icons/columns-2.svg" alt=""><span>Compare</span></button>
      <button id="export" type="button" title="Export PNG" aria-label="Export PNG" disabled><img src="./icons/download.svg" alt=""><span>Export PNG</span></button>
    </div>
  </header>
  <section id="mix-controls" class="mix-controls" hidden aria-label="Neighborhood mixing">
    <label for="growth-mix">Requested growth <input id="growth-mix" type="range" min="0" max="100" step="1" value="50"><output id="growth-mix-value">50%</output></label>
    <output id="mix-summary" aria-live="polite"></output>
    <button id="district-policies" type="button" title="District policies" aria-label="District policies"><img src="./icons/settings-2.svg" alt=""><span>Districts</span></button>
  </section>
  <dialog id="district-dialog" class="district-dialog" aria-labelledby="district-heading">
    <form method="dialog"><header><h2 id="district-heading">District Policies</h2><button title="Close district policies" aria-label="Close district policies"><img src="./icons/x.svg" alt=""></button></header></form>
    <div id="district-policy-list" class="district-policy-list"></div>
    <footer><button id="reset-district-policies" type="button" title="Reset district policies to Automatic" aria-label="Reset district policies to Automatic"><img src="./icons/rotate-ccw.svg" alt=""><span>Reset</span></button><button id="apply-district-policies" type="button" title="Apply district policies" aria-label="Apply district policies"><img src="./icons/check.svg" alt=""><span>Apply</span></button></footer>
  </dialog>
  <output id="build-status" role="status" hidden></output>
  <div id="frontage-legend" class="diagnostic-legend" hidden><span><i style="background:#365d88"></i>Streets</span><span><i style="background:#d4e4ee"></i>Plots</span><span><i style="background:#b36a24"></i>Frontage</span><span><i style="background:#dbe8c3"></i>Remaining</span><span><i style="background:#e8b7b7"></i>Excluded</span></div>
  <dialog id="link-dialog"><form method="dialog"><label for="city-link">City link</label><input id="city-link" type="text" readonly><button>Close</button></form></dialog>
  <main id="openfl-content" aria-label="Generated city map"></main>
  <script src="./vendor/polygon-clipping.umd.min.js"></script>
  <script src="./vendor/frontage-geometry.js"></script>
  <script src="./build-info.js?build=__CITY_BUILD_ID__"></script>
  <script src="./TownGenerator.js?build=__CITY_BUILD_ID__"></script>
  <script src="./controls.js?build=__CITY_BUILD_ID__"></script>
  <script>lime.embed("TownGenerator", "openfl-content", 0, 0, { parameters: {} });</script>
</body>
</html>
