<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>City Generator</title>
  <link rel="icon" href="./favicon.png">
  <link rel="stylesheet" href="./controls.css">
</head>
<body>
  <header class="toolbar">
    <div class="identity">
      <h1>City Generator</h1>
      <span class="seed">Seed <output id="seed"></output></span>
    </div>
    <div class="settings">
      <label for="city-size">City size <input id="city-size" type="number" min="6" max="40" step="1" value="40" disabled></label>
      <label class="wall-setting"><input id="walls" type="checkbox" disabled> Walls</label>
    </div>
    <div class="actions">
      <button id="regenerate" type="button" title="Generate a new city" aria-label="Generate a new city" disabled><img src="./icons/refresh-cw.svg" alt=""><span>Generate</span></button>
      <button id="export" type="button" title="Export PNG" aria-label="Export PNG" disabled><img src="./icons/download.svg" alt=""><span>Export PNG</span></button>
    </div>
  </header>
  <main id="openfl-content" aria-label="Generated city map"></main>
  <script src="./TownGenerator.js"></script>
  <script src="./controls.js"></script>
  <script>lime.embed("TownGenerator", "openfl-content", 0, 0, { parameters: {} });</script>
</body>
</html>
